<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>間取り図作成ツール</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:#f0f4f8;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
#top-bar{display:flex;align-items:center;gap:5px;padding:7px 8px;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.act-btn{display:flex;align-items:center;gap:4px;padding:0 11px;height:42px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#374151;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.act-btn:active{background:#f3f4f6;transform:scale(0.96)}
.act-btn.save{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.act-btn.save:active{background:#1e40af}
.act-btn.tpl{background:#059669;border-color:#059669;color:#fff}
.act-btn.tpl:active{background:#047857}
.spacer{flex:1}
#tools-row{display:flex;overflow-x:auto;gap:5px;padding:7px 8px;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tools-row::-webkit-scrollbar{display:none}
.tool-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 8px;min-width:54px;height:58px;border:1.5px solid #e5e7eb;border-radius:12px;background:#fff;color:#6b7280;font-size:10px;font-weight:500;cursor:pointer;flex-shrink:0}
.tool-btn i{font-size:22px;line-height:1}
.tool-btn.active{background:#eff6ff;border-color:#3b82f6;color:#1d4ed8}
.tool-btn:active{transform:scale(0.93)}
#furn-row{display:none;overflow-x:auto;gap:5px;padding:5px 8px;background:#f9fafb;border-bottom:1px solid #e5e7eb;flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#furn-row::-webkit-scrollbar{display:none}
.furn-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 8px;min-width:54px;height:50px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;font-size:10px;font-weight:500;color:#6b7280;cursor:pointer;flex-shrink:0}
.furn-btn .fi{font-size:18px;line-height:1}
.furn-btn.active{background:#f5f3ff;border-color:#7c3aed;color:#5b21b6}
.furn-btn:active{transform:scale(0.93)}
#scale-bar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#f0f9ff;border-bottom:1px solid #bae6fd;font-size:11px;color:#0369a1;flex-shrink:0}
#scale-bar label{font-weight:600}
#scale-select{font-size:11px;padding:3px 6px;border:1px solid #7dd3fc;border-radius:6px;background:#fff;color:#0369a1}
#scale-ruler{flex:1;display:flex;align-items:center;gap:4px}
.ruler-line{height:6px;background:#0ea5e9;border-radius:2px}

/* ─── メインエリア（キャンバス＋サイドパネル） ─── */
#main-area{flex:1;display:flex;overflow:hidden;position:relative}
#canvas-wrap{flex:1;overflow:hidden;position:relative;background:#fff}
canvas{display:block;touch-action:none;cursor:crosshair}

/* ─── サイドパネル（右側固定） ─── */
#props{width:0;background:#fff;border-left:1px solid #e5e7eb;overflow:hidden;transition:width 0.2s ease;flex-shrink:0;display:flex;flex-direction:column}
#props.open{width:160px}
#props-inner{width:160px;padding:10px;overflow-y:auto;flex:1}
#props-inner h3{font-size:11px;font-weight:700;color:#374151;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
#props-close{font-size:16px;cursor:pointer;color:#9ca3af;line-height:1;background:none;border:none;padding:0}
.pr{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.pr label{font-size:10px;color:#6b7280}
#lbl-input{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:6px 8px;font-size:12px;color:#111827;background:#fff}
.size-row{display:flex;gap:4px;margin-bottom:8px}
.size-item{flex:1;display:flex;flex-direction:column;gap:3px}
.size-item label{font-size:10px;color:#6b7280}
.size-input{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:5px 6px;font-size:12px;color:#111827;background:#fff;text-align:center}
.clr-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.clr-item{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:10px;color:#6b7280}
input[type=color]{width:36px;height:30px;border:1px solid #d1d5db;border-radius:6px;padding:1px;cursor:pointer;background:#fff}
.rot-row{display:flex;align-items:center;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.rot-row label{font-size:10px;color:#6b7280;width:100%}
.rot-btn{display:flex;align-items:center;justify-content:center;flex:1;height:32px;border:1px solid #d1d5db;border-radius:7px;background:#fff;cursor:pointer;font-size:14px;color:#374151}
.rot-btn:active{background:#f3f4f6}
.rot-val{font-size:11px;color:#374151;text-align:center;width:100%;margin-top:2px}
.del-btn{width:100%;height:38px;border:1.5px solid #ef4444;border-radius:9px;color:#dc2626;background:transparent;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
.del-btn:active{background:#fef2f2}

/* ─── テンプレートモーダル ─── */
#tpl-modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
#tpl-modal.open{display:flex}
#tpl-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:80dvh;overflow-y:auto;padding:16px}
#tpl-sheet h2{font-size:15px;font-weight:700;color:#111827;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#tpl-close{font-size:24px;cursor:pointer;color:#9ca3af;background:none;border:none;line-height:1}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl-card{border:1.5px solid #e5e7eb;border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:center}
.tpl-card:active{background:#f0fdf4;border-color:#4ade80}
.tpl-card .tpl-icon{font-size:32px;margin-bottom:6px}
.tpl-card .tpl-name{font-size:12px;font-weight:600;color:#111827}
.tpl-card .tpl-desc{font-size:10px;color:#6b7280;margin-top:2px}
#status{padding:4px 12px;font-size:11px;color:#9ca3af;background:#f9fafb;border-top:1px solid #e5e7eb;flex-shrink:0;min-height:24px}
</style>
</head>
<body>
<div id="top-bar">
  <button class="act-btn" onclick="undo()"><i class="ti ti-arrow-back-up"></i>戻す</button>
  <button class="act-btn" onclick="clearAll()"><i class="ti ti-trash"></i>クリア</button>
  <button class="act-btn tpl" onclick="openTpl()"><i class="ti ti-template"></i>テンプレート</button>
  <div class="spacer"></div>
  <button class="act-btn save" onclick="saveJpeg()"><i class="ti ti-download"></i>JPEG保存</button>
</div>
<div id="tools-row">
  <button class="tool-btn active" id="btn-select" onclick="setTool('select')"><i class="ti ti-cursor-text"></i>選択/移動</button>
  <button class="tool-btn" id="btn-room" onclick="setTool('room')"><i class="ti ti-square"></i>部屋</button>
  <button class="tool-btn" id="btn-wall" onclick="setTool('wall')"><i class="ti ti-minus"></i>壁</button>
  <button class="tool-btn" id="btn-door" onclick="setTool('door')"><i class="ti ti-door"></i>開きドア</button>
  <button class="tool-btn" id="btn-slidedoor" onclick="setTool('slidedoor')"><i class="ti ti-layout-sidebar"></i>引き戸</button>
  <button class="tool-btn" id="btn-window" onclick="setTool('window')"><i class="ti ti-layout-navbar"></i>窓</button>
  <button class="tool-btn" id="btn-furniture" onclick="setTool('furniture')"><i class="ti ti-armchair"></i>家具</button>
  <button class="tool-btn" id="btn-text" onclick="setTool('text')"><i class="ti ti-text-size"></i>テキスト</button>
</div>
<div id="furn-row">
  <button class="furn-btn active" onclick="selFurn(this,'bed')"><span class="fi">🛏</span>ベッド</button>
  <button class="furn-btn" onclick="selFurn(this,'sofa')"><span class="fi">🛋</span>ソファ</button>
  <button class="furn-btn" onclick="selFurn(this,'table')"><span class="fi">🍽</span>テーブル</button>
  <button class="furn-btn" onclick="selFurn(this,'desk')"><span class="fi">💼</span>デスク</button>
  <button class="furn-btn" onclick="selFurn(this,'toilet')"><span class="fi">🚽</span>トイレ</button>
  <button class="furn-btn" onclick="selFurn(this,'bath')"><span class="fi">🛁</span>浴槽</button>
  <button class="furn-btn" onclick="selFurn(this,'sink')"><span class="fi">🚿</span>洗面台</button>
  <button class="furn-btn" onclick="selFurn(this,'closet')"><span class="fi">👕</span>収納</button>
  <button class="furn-btn" onclick="selFurn(this,'tv')"><span class="fi">📺</span>テレビ台</button>
  <button class="furn-btn" onclick="selFurn(this,'handrail')"><span class="fi">🦯</span>手すり</button>
</div>
<div id="scale-bar">
  <label>縮尺:</label>
  <select id="scale-select" onchange="updateScale()">
    <option value="100">1マス=50cm</option>
    <option value="50" selected>1マス=1m</option>
    <option value="25">1マス=2m</option>
    <option value="20">1マス=2.5m</option>
  </select>
  <div id="scale-ruler">
    <div class="ruler-line" id="ruler-line" style="width:80px"></div>
    <span id="ruler-label">4m</span>
  </div>
</div>

<div id="main-area">
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>

  <!-- サイドパネル（右側） -->
  <div id="props">
    <div id="props-inner">
      <h3>設定 <button id="props-close" onclick="closeProps()">×</button></h3>
      <div class="pr">
        <label>名前</label>
        <input type="text" id="lbl-input" placeholder="部屋名など" oninput="updLabel(this.value)">
      </div>
      <div class="size-row" id="size-row">
        <div class="size-item">
          <label>幅(px)</label>
          <input type="number" class="size-input" id="size-w" min="20" step="20" onchange="updSize()">
        </div>
        <div class="size-item">
          <label>高(px)</label>
          <input type="number" class="size-input" id="size-h" min="20" step="20" onchange="updSize()">
        </div>
      </div>
      <div class="clr-row">
        <div class="clr-item"><label>背景</label><input type="color" id="fill-c" value="#dbeafe" onchange="updFill(this.value)"></div>
        <div class="clr-item"><label>線色</label><input type="color" id="stroke-c" value="#1e3a5f" onchange="updStroke(this.value)"></div>
      </div>
      <div class="rot-row" id="rot-row">
        <label>回転</label>
        <button class="rot-btn" onclick="rotate(-90)">↺</button>
        <button class="rot-btn" onclick="rotate(90)">↻</button>
        <button class="rot-btn" onclick="rotate(45)" style="font-size:11px">45°</button>
        <div class="rot-val" id="rot-val">0°</div>
      </div>
      <button class="del-btn" onclick="delSel()"><i class="ti ti-trash"></i>削除</button>
    </div>
  </div>
</div>

<div id="status">「選択/移動」でタップして選択・ドラッグで移動</div>

<div id="tpl-modal">
  <div id="tpl-sheet">
    <h2>テンプレートを選択 <button id="tpl-close" onclick="closeTpl()">×</button></h2>
    <div class="tpl-grid">
      <div class="tpl-card" onclick="loadTpl('yuryo')"><div class="tpl-icon">🏥</div><div class="tpl-name">一人部屋</div><div class="tpl-desc">居室＋トイレ・収納・洗面台</div></div>
      <div class="tpl-card" onclick="loadTpl('futari')"><div class="tpl-icon">🏥</div><div class="tpl-name">二人部屋</div><div class="tpl-desc">居室（2床）＋トイレ・収納・洗面台</div></div>
      <div class="tpl-card" onclick="loadTpl('1k')"><div class="tpl-icon">🏠</div><div class="tpl-name">1K</div><div class="tpl-desc">洋室＋キッチン・水回り</div></div>
      <div class="tpl-card" onclick="loadTpl('2k')"><div class="tpl-icon">🏗</div><div class="tpl-name">2K</div><div class="tpl-desc">2室＋キッチン</div></div>
      <div class="tpl-card" onclick="loadTpl('2dk')"><div class="tpl-icon">🏡</div><div class="tpl-name">2DK</div><div class="tpl-desc">2室＋DK・水回り</div></div>
      <div class="tpl-card" onclick="loadTpl('1ldk')"><div class="tpl-icon">🏘</div><div class="tpl-name">1LDK</div><div class="tpl-desc">LDK＋洋室＋水回り</div></div>
      <div class="tpl-card" onclick="loadTpl('2ldk')"><div class="tpl-icon">🏠</div><div class="tpl-name">2LDK</div><div class="tpl-desc">LDK＋2室＋水回り</div></div>
      <div class="tpl-card" onclick="loadTpl('3ldk')"><div class="tpl-icon">🏡</div><div class="tpl-name">3LDK</div><div class="tpl-desc">LDK＋3室＋水回り</div></div>
      <div class="tpl-card" onclick="loadTpl('house2f')"><div class="tpl-icon">🏘</div><div class="tpl-name">戸建て（2階建て）</div><div class="tpl-desc">1F:LDK・水回り　2F:2室</div></div>
      <div class="tpl-card" onclick="loadTpl('house3f')"><div class="tpl-icon">🏢</div><div class="tpl-name">戸建て（3階建て）</div><div class="tpl-desc">1F:LDK　2F:2室　3F:1室</div></div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('canvas-wrap');
const GRID=20;
let tool='select',shapes=[],selected=null,history=[];
let drawing=false,sx=0,sy=0,preview=null;
let dragOff={x:0,y:0},dragging=false;
let furn='bed';
let scalePx=50;
const RCOLS=['#dbeafe','#dcfce7','#fef9c3','#fce7f3','#ede9fe','#ffedd5','#e0f2fe','#f0fdf4'];
let rci=0;

function resize(){const r=wrap.getBoundingClientRect();canvas.width=r.width;canvas.height=r.height;draw();}
function snap(v){return Math.round(v/GRID)*GRID;}
function tpt(e){const t=e.touches[0]||e.changedTouches[0],r=canvas.getBoundingClientRect();return{x:snap(t.clientX-r.left),y:snap(t.clientY-r.top)};}
function mpt(e){const r=canvas.getBoundingClientRect();return{x:snap(e.clientX-r.left),y:snap(e.clientY-r.top)};}
function rawTpt(e){const t=e.touches[0]||e.changedTouches[0],r=canvas.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}
function rawMpt(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

function selFurn(el,f){furn=f;document.querySelectorAll('.furn-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function updateScale(){
  const v=parseInt(document.getElementById('scale-select').value);scalePx=v;
  const rulerPx=4*GRID,rulerM=(rulerPx/v).toFixed(rulerPx/v<1?1:0);
  document.getElementById('ruler-line').style.width=rulerPx+'px';
  document.getElementById('ruler-label').textContent=rulerM+'m';draw();
}
function setTool(t){
  tool=t;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+t)?.classList.add('active');
  document.getElementById('furn-row').style.display=t==='furniture'?'flex':'none';
  selected=null;closeProps();draw();
  const m={select:'タップで選択・ドラッグで移動',room:'スワイプして部屋を描く',wall:'スワイプして壁を引く',door:'タップして開きドアを置く',slidedoor:'タップして引き戸を置く',window:'タップして窓を置く',furniture:'家具を選んでタップ',text:'タップしてテキスト入力'};
  st(m[t]||'');
}
function st(m){document.getElementById('status').textContent=m;}
function ph(){history.push(JSON.parse(JSON.stringify(shapes)));}

/* ─── 描画順: 部屋を一番下、壁・ドアを中間、家具・テキストを上 ─── */
function sortedShapes(){
  const order={room:0,wall:1,door:2,slidedoor:2,window:2,furniture:3,text:4};
  return [...shapes].sort((a,b)=>(order[a.type]||0)-(order[b.type]||0));
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  drawGrid();
  sortedShapes().forEach(s=>ds(s,false));
  if(preview)ds(preview,true);
  if(selected)drawSel(selected);
}

function drawGrid(){
  ctx.strokeStyle='rgba(0,0,0,0.07)';ctx.lineWidth=0.5;
  for(let x=0;x<=canvas.width;x+=GRID){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<=canvas.height;y+=GRID){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
}

function withRot(s,fn){
  const rot=s.rot||0;if(rot===0){fn();return;}
  const cx=s.type==='wall'?(s.x1+s.x2)/2:s.x+(s.w||0)/2;
  const cy=s.type==='wall'?(s.y1+s.y2)/2:s.y+(s.h||0)/2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot*Math.PI/180);ctx.translate(-cx,-cy);fn();ctx.restore();
}

function ds(s,ip){
  ctx.globalAlpha=ip?0.55:1;
  withRot(s,()=>{
    if(s.type==='room'){
      ctx.fillStyle=s.fill||'#dbeafe';ctx.strokeStyle=s.stroke||'#1e3a5f';ctx.lineWidth=s.sw||2;
      ctx.beginPath();ctx.rect(s.x,s.y,s.w,s.h);ctx.fill();ctx.stroke();
      if(s.label){ctx.fillStyle='#1e3a5f';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.label,s.x+s.w/2,s.y+s.h/2);}
    }else if(s.type==='wall'){
      ctx.strokeStyle=s.stroke||'#1e3a5f';ctx.lineWidth=s.sw||5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    }else if(s.type==='door'){
      const sz=s.w||40;ctx.strokeStyle=s.stroke||'#1e3a5f';ctx.lineWidth=2;ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.beginPath();ctx.rect(s.x,s.y,8,sz);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(s.x+8,s.y);ctx.arc(s.x+8,s.y+sz,sz-8,Math.PI*1.5,0,false);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s.x+8,s.y);ctx.lineTo(s.x+8+sz-8,s.y+sz);ctx.stroke();
      if(s.label){ctx.fillStyle='#1e3a5f';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(s.label,s.x+sz/2,s.y-6);}
    }else if(s.type==='slidedoor'){
      const sz=s.w||60;ctx.strokeStyle=s.stroke||'#1e3a5f';ctx.lineWidth=2;ctx.fillStyle='rgba(219,234,254,0.7)';
      ctx.beginPath();ctx.rect(s.x,s.y,sz,16);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.rect(s.x+2,s.y+2,sz*0.55,12);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#6b7280';ctx.lineWidth=1;
      const ax=s.x+sz*0.7,ay=s.y+8;
      ctx.beginPath();ctx.moveTo(ax-10,ay);ctx.lineTo(ax+10,ay);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ax+5,ay-4);ctx.lineTo(ax+10,ay);ctx.lineTo(ax+5,ay+4);ctx.stroke();
      if(s.label){ctx.fillStyle='#1e3a5f';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(s.label,s.x+sz/2,s.y-6);}
    }else if(s.type==='window'){
      const sz=s.w||60;ctx.strokeStyle=s.stroke||'#2563eb';ctx.lineWidth=2;ctx.fillStyle='#bfdbfe';
      ctx.beginPath();ctx.rect(s.x,s.y,sz,12);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(s.x+sz/2,s.y);ctx.lineTo(s.x+sz/2,s.y+12);ctx.stroke();
    }else if(s.type==='furniture'){
      const W=s.w||60,H=s.h||80;
      ctx.fillStyle=s.fill||'#e0e7ff';ctx.strokeStyle=s.stroke||'#4338ca';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.rect(s.x,s.y,W,H);ctx.fill();ctx.stroke();
      const ic={bed:'🛏',table:'🍽',toilet:'🚽',bath:'🛁',sink:'🚿',sofa:'🛋',desk:'💼',closet:'👕',tv:'📺',handrail:'🦯',wheelchair:'♿'};
      ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(ic[s.ftype]||'□',s.x+W/2,s.y+H/2-8);
      const lb={bed:'ベッド',table:'テーブル',toilet:'トイレ',bath:'浴槽',sink:'洗面台',sofa:'ソファ',desk:'デスク',closet:'収納',tv:'テレビ台',handrail:'手すり',wheelchair:'車いす'};
      ctx.fillStyle=s.stroke||'#4338ca';ctx.font='10px sans-serif';ctx.fillText(s.label||lb[s.ftype]||'',s.x+W/2,s.y+H/2+10);
    }else if(s.type==='text'){
      ctx.fillStyle=s.stroke||'#1e3a5f';ctx.font='14px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
      ctx.fillText(s.label||'テキスト',s.x,s.y);
    }
  });
  ctx.globalAlpha=1;
}

function drawSel(s){
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.setLineDash([5,4]);
  withRot(s,()=>{
    if(s.type==='room'){ctx.strokeRect(s.x-4,s.y-4,s.w+8,s.h+8);}
    else if(s.type==='wall'){ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();}
    else if(s.type==='furniture'){ctx.strokeRect(s.x-4,s.y-4,s.w+8,s.h+8);}
    else if(['door','slidedoor'].includes(s.type)){const sz=s.w||60;ctx.strokeRect(s.x-4,s.y-4,sz+8,sz+8);}
    else if(s.type==='window'){ctx.strokeRect(s.x-4,s.y-4,(s.w||60)+8,22);}
    else if(s.type==='text'){ctx.strokeRect(s.x-4,s.y-4,120,22);}
  });
  ctx.setLineDash([]);
}

function rotPt(px,py,cx,cy,deg){const r=deg*Math.PI/180,cos=Math.cos(r),sin=Math.sin(r);return{x:cx+(px-cx)*cos-(py-cy)*sin,y:cy+(px-cx)*sin+(py-cy)*cos};}
function getCx(s){return s.type==='wall'?(s.x1+s.x2)/2:s.x+(s.w||60)/2;}
function getCy(s){return s.type==='wall'?(s.y1+s.y2)/2:s.y+(s.h||60)/2;}
function hit(s,x,y){
  const rot=s.rot||0;if(rot!==0){const p=rotPt(x,y,getCx(s),getCy(s),-rot);x=p.x;y=p.y;}
  if(s.type==='room')return x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h;
  if(s.type==='wall'){const dx=s.x2-s.x1,dy=s.y2-s.y1,l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(x-s.x1,y-s.y1)<12;const t=Math.max(0,Math.min(1,((x-s.x1)*dx+(y-s.y1)*dy)/l2));return Math.hypot(x-s.x1-t*dx,y-s.y1-t*dy)<12;}
  if(s.type==='furniture')return x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h;
  if(s.type==='door'){const sz=s.w||40;return x>=s.x&&x<=s.x+sz&&y>=s.y&&y<=s.y+sz;}
  if(s.type==='slidedoor'){const sz=s.w||60;return x>=s.x&&x<=s.x+sz&&y>=s.y&&y<=s.y+16;}
  if(s.type==='window')return x>=s.x&&x<=s.x+(s.w||60)&&y>=s.y&&y<=s.y+20;
  if(s.type==='text')return x>=s.x&&x<=s.x+120&&y>=s.y&&y<=s.y+20;
  return false;
}

/* ─── ヒットテストは描画順の逆（上にあるものを優先）─── */
function hitSorted(x,y){
  const order={room:0,wall:1,door:2,slidedoor:2,window:2,furniture:3,text:4};
  const sorted=[...shapes].sort((a,b)=>(order[b.type]||0)-(order[a.type]||0));
  return sorted.find(s=>hit(s,x,y))||null;
}

let touchStartPt=null,touchMoved=false;
function onS(p,raw){
  touchStartPt=raw;touchMoved=false;
  if(tool==='select'){
    const h=hitSorted(p.x,p.y);
    selected=h||null;
    if(selected){
      dragging=true;
      if(selected.type==='wall')dragOff={x:p.x-selected.x1,y:p.y-selected.y1};
      else dragOff={x:p.x-selected.x,y:p.y-selected.y};
      showP();
    }else{closeProps();}
    draw();return;
  }
  drawing=true;sx=p.x;sy=p.y;
  if(tool==='door'){ph();shapes.push({type:'door',x:p.x,y:p.y,w:40,sw:2,stroke:'#1e3a5f',fill:'#fff',label:'',rot:0});selected=shapes[shapes.length-1];showP();draw();drawing=false;}
  else if(tool==='slidedoor'){ph();shapes.push({type:'slidedoor',x:p.x,y:p.y,w:80,sw:2,stroke:'#1e3a5f',fill:'#bfdbfe',label:'',rot:0});selected=shapes[shapes.length-1];showP();draw();drawing=false;}
  else if(tool==='window'){ph();shapes.push({type:'window',x:p.x,y:p.y,w:60,sw:2,stroke:'#2563eb',fill:'#bfdbfe',label:'',rot:0});selected=shapes[shapes.length-1];showP();draw();drawing=false;}
  else if(tool==='furniture'){
    ph();
    const dm={bed:{w:60,h:80},table:{w:80,h:80},toilet:{w:40,h:60},bath:{w:60,h:100},sink:{w:40,h:40},sofa:{w:120,h:50},desk:{w:80,h:60},closet:{w:100,h:40},tv:{w:80,h:40},handrail:{w:80,h:16},wheelchair:{w:60,h:80}};
    const d=dm[furn]||{w:60,h:60};
    shapes.push({type:'furniture',ftype:furn,x:p.x,y:p.y,w:d.w,h:d.h,sw:1.5,stroke:'#4338ca',fill:'#e0e7ff',label:'',rot:0});
    selected=shapes[shapes.length-1];showP();draw();drawing=false;
  }else if(tool==='text'){
    const txt=prompt('テキストを入力:','洋室');
    if(txt){ph();shapes.push({type:'text',x:p.x,y:p.y,label:txt,sw:14,stroke:'#1e3a5f',rot:0});selected=shapes[shapes.length-1];showP();}
    draw();drawing=false;
  }
}

function onM(p,raw){
  if(raw&&touchStartPt){const dx=raw.x-touchStartPt.x,dy=raw.y-touchStartPt.y;if(Math.hypot(dx,dy)>6)touchMoved=true;}
  if(dragging&&selected&&(touchMoved||true)){
    if(selected.type==='wall'){const dx=p.x-dragOff.x-selected.x1,dy=p.y-dragOff.y-selected.y1;selected.x1+=dx;selected.y1+=dy;selected.x2+=dx;selected.y2+=dy;dragOff={x:p.x-selected.x1,y:p.y-selected.y1};}
    else{selected.x=p.x-dragOff.x;selected.y=p.y-dragOff.y;}
    draw();return;
  }
  if(!drawing)return;
  const x=Math.min(sx,p.x),y=Math.min(sy,p.y),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);
  if(tool==='room')preview={type:'room',x,y,w:Math.max(w,GRID),h:Math.max(h,GRID),fill:RCOLS[rci%RCOLS.length],stroke:'#1e3a5f',sw:2,label:'',rot:0};
  else if(tool==='wall')preview={type:'wall',x1:sx,y1:sy,x2:p.x,y2:p.y,stroke:'#1e3a5f',sw:5,rot:0};
  draw();
}

function onE(p){
  dragging=false;
  if(!drawing){draw();return;}
  const x=Math.min(sx,p.x),y=Math.min(sy,p.y),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);
  if(tool==='room'&&(w>GRID||h>GRID)){ph();shapes.push({type:'room',x,y,w,h,fill:RCOLS[rci%RCOLS.length],stroke:'#1e3a5f',sw:2,label:'',rot:0});rci++;selected=shapes[shapes.length-1];showP();}
  else if(tool==='wall'&&(w>GRID||h>GRID)){ph();shapes.push({type:'wall',x1:sx,y1:sy,x2:p.x,y2:p.y,stroke:'#1e3a5f',sw:5,rot:0});selected=shapes[shapes.length-1];showP();}
  drawing=false;preview=null;draw();
}

canvas.addEventListener('touchstart',e=>{e.preventDefault();onS(tpt(e),rawTpt(e));},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();onM(tpt(e),rawTpt(e));},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();onE(tpt(e));},{passive:false});
canvas.addEventListener('mousedown',e=>onS(mpt(e),rawMpt(e)));
canvas.addEventListener('mousemove',e=>onM(mpt(e),rawMpt(e)));
canvas.addEventListener('mouseup',e=>onE(mpt(e)));

/* ─── プロパティパネル ─── */
function showP(){
  const p=document.getElementById('props');
  p.classList.add('open');
  document.getElementById('lbl-input').value=selected?.label||'';
  document.getElementById('fill-c').value=selected?.fill||'#dbeafe';
  document.getElementById('stroke-c').value=selected?.stroke||'#1e3a5f';
  document.getElementById('rot-val').textContent=(selected?.rot||0)+'°';
  // サイズ入力：部屋・家具・ドア・引き戸・窓
  const sizeRow=document.getElementById('size-row');
  const hasSize=['room','furniture','door','slidedoor','window'].includes(selected?.type);
  sizeRow.style.display=hasSize?'flex':'none';
  if(hasSize){
    document.getElementById('size-w').value=selected.w||60;
    document.getElementById('size-h').value=selected.h||selected.w||60;
    // 高さ入力は幅しかないタイプは非表示
    document.getElementById('size-h').parentElement.style.display=['door','slidedoor','window'].includes(selected?.type)?'none':'flex';
  }
  document.getElementById('rot-row').style.display=selected?.type==='wall'?'none':'flex';
  setTimeout(()=>resize(),10);
}
function closeProps(){
  document.getElementById('props').classList.remove('open');
  setTimeout(()=>resize(),210);
}
function updLabel(v){if(selected){selected.label=v;draw();}}
function updFill(v){if(selected){selected.fill=v;draw();}}
function updStroke(v){if(selected){selected.stroke=v;draw();}}
function updSize(){
  if(!selected)return;
  const w=parseInt(document.getElementById('size-w').value)||20;
  const h=parseInt(document.getElementById('size-h').value)||20;
  selected.w=Math.max(20,Math.round(w/20)*20);
  if(!['door','slidedoor','window'].includes(selected.type))selected.h=Math.max(20,Math.round(h/20)*20);
  draw();
}
function rotate(deg){if(!selected)return;ph();selected.rot=((selected.rot||0)+deg+360)%360;document.getElementById('rot-val').textContent=selected.rot+'°';draw();}
function delSel(){if(!selected)return;ph();shapes=shapes.filter(s=>s!==selected);selected=null;closeProps();draw();}
function undo(){if(!history.length)return;shapes=history.pop();selected=null;closeProps();draw();st('元に戻しました');}
function clearAll(){if(!confirm('すべてクリアしますか?'))return;ph();shapes=[];selected=null;closeProps();draw();}

/* ─── JPEG保存（描画範囲のみ） ─── */
function saveJpeg(){
  if(shapes.length===0){alert('まず図を描いてください');return;}
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  shapes.forEach(s=>{
    let x1,y1,x2,y2;
    if(s.type==='wall'){x1=Math.min(s.x1,s.x2);y1=Math.min(s.y1,s.y2);x2=Math.max(s.x1,s.x2);y2=Math.max(s.y1,s.y2);}
    else if(s.type==='text'){x1=s.x;y1=s.y;x2=s.x+120;y2=s.y+20;}
    else{x1=s.x;y1=s.y;x2=s.x+(s.w||60);y2=s.y+(s.h||60);}
    if(x1<minX)minX=x1;if(y1<minY)minY=y1;if(x2>maxX)maxX=x2;if(y2>maxY)maxY=y2;
  });
  const PAD=24;
  minX=Math.max(0,minX-PAD);minY=Math.max(0,minY-PAD);
  maxX=Math.min(canvas.width,maxX+PAD);maxY=Math.min(canvas.height,maxY+PAD);
  const W=maxX-minX,H=maxY-minY;
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;
  const tc=tmp.getContext('2d');tc.fillStyle='#fff';tc.fillRect(0,0,W,H);tc.drawImage(canvas,minX,minY,W,H,0,0,W,H);
  const a=document.createElement('a');a.download='floor-plan.jpg';a.href=tmp.toDataURL('image/jpeg',0.95);a.click();
  st('描画範囲のみJPEGで保存しました！');
}
